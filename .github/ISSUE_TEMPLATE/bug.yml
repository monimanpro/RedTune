name: Bug
description: Something broke, crashed or does the wrong thing.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If Red Tune or Windows no longer starts properly, hold **Shift** while Red Tune starts: it then applies nothing.
        Russian is fine too / можно писать по-русски.
  - type: input
    id: version
    attributes:
      label: Red Tune version
      placeholder: "0.4.5"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: System report
      description: About → «Copy report».
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error record or journal (optional)
      description: After a crash, «Send to GitHub» in **About** fills this with the error and where it happened; the journal is not sent. You can add the end of `%APPDATA%\RedTune\redtune.log` yourself, around the time it happened — it names your presets and may name programs and folders with your Windows user name, so edit out what you like.
      render: text
