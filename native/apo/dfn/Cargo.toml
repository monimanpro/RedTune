[package]
name = "rtdf"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
deep_filter = { path = "DeepFilterNet/libDF", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"   # a panic must not take Windows' sound process down: caught at the door
debug = false
strip = true
